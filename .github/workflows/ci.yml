name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # No install step: the package has no dependencies, and the tests and
      # coverage gate use Node's built-in test runner.

      # Runs the tests and fails unless coverage is 100%.
      - run: npm run coverage

      - run: make pack-check
