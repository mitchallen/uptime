name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Authenticate to GitHub Packages without setup-node's registry-url/scope
      # inputs, which write a scope mapping that breaks npm ci.
      - run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs the tests and fails unless coverage is 100%.
      - run: npm run coverage

      # Runs after coverage so it proves the files allowlist excludes coverage/.
      - run: make pack-check
