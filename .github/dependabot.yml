version: 2
updates:
  # Only GitHub Actions are tracked. The package has no npm dependencies,
  # runtime or dev (tests use node:test), so there is nothing for the npm
  # ecosystem to update. If you add an npm dependency, add an npm entry back.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
